version: '3.8'

services:
  app:
    build: .
    container_name: gardengenie-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: gardengenie-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plant_detection
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
